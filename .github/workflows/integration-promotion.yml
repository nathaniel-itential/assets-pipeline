name: Integration Promotion Pipeline

on:
  push:
    tags:
      - "v*"

jobs:
  deploy-integrations-staging:
    if: contains(github.ref, '-rc')
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install git+https://github.com/nathaniel-itential/asyncplatform.git@devel

      - name: Find changed specs
        id: find-specs
        env:
          OPENAPI_DIR: "OpenAPIs"
        run: |
          PREV_TAG=$(git tag --sort=-creatordate \
            | grep -v "^${GITHUB_REF_NAME}$" \
            | head -1 || true)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag — processing all specs"
            CHANGED_SPECS=$(find . -path "*/${OPENAPI_DIR}/*.json" -type f | jq -R . | jq -sc .)
          else
            echo "Diffing against $PREV_TAG"
            CHANGED_SPECS=$(git diff --name-only --diff-filter=AM "$PREV_TAG" HEAD \
              | grep "${OPENAPI_DIR}/.*\.json$" | jq -R . | jq -sc . || echo "[]")
          fi

          echo "$CHANGED_SPECS" | jq -r '.[]' > /tmp/specs.txt
          echo "changed_specs=$CHANGED_SPECS" >> "$GITHUB_OUTPUT"
          count=$(echo "$CHANGED_SPECS" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "No integration changes detected — skipping"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found $count changed spec(s)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import integration models
        if: steps.find-specs.outputs.has_changes == 'true'
        env:
          HOST: ${{ secrets.PLATFORM_HOST }}
          CLIENT_ID: ${{ secrets.PLATFORM_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PLATFORM_CLIENT_SECRET }}
          CHANGED_SPECS: ${{ steps.find-specs.outputs.changed_specs }}
        run: python .github/scripts/deploy_integrations.py Staging


  deploy-integrations-production:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install git+https://github.com/nathaniel-itential/asyncplatform.git@devel

      - name: Find changed specs
        id: find-specs
        env:
          OPENAPI_DIR: "OpenAPIs"
        run: |
          PREV_TAG=$(git tag --sort=-creatordate \
            | grep -v "^${GITHUB_REF_NAME}$" \
            | grep -v "\-rc" \
            | head -1 || true)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag — processing all specs"
            CHANGED_SPECS=$(find . -path "*/${OPENAPI_DIR}/*.json" -type f | jq -R . | jq -sc .)
          else
            echo "Diffing against $PREV_TAG"
            CHANGED_SPECS=$(git diff --name-only --diff-filter=AM "$PREV_TAG" HEAD \
              | grep "${OPENAPI_DIR}/.*\.json$" | jq -R . | jq -sc . || echo "[]")
          fi

          echo "$CHANGED_SPECS" | jq -r '.[]' > /tmp/specs.txt
          echo "changed_specs=$CHANGED_SPECS" >> "$GITHUB_OUTPUT"
          count=$(echo "$CHANGED_SPECS" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "No integration changes detected — skipping"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found $count changed spec(s)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import integration models
        if: steps.find-specs.outputs.has_changes == 'true'
        env:
          HOST: ${{ secrets.PLATFORM_HOST }}
          CLIENT_ID: ${{ secrets.PLATFORM_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PLATFORM_CLIENT_SECRET }}
          CHANGED_SPECS: ${{ steps.find-specs.outputs.changed_specs }}
        run: python .github/scripts/deploy_integrations.py Production
