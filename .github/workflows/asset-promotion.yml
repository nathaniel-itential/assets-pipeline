name: Itential Asset Promotion Pipeline

on:
  workflow_run:
    workflows: ["Integration Promotion Pipeline"]
    types: [completed]

jobs:
  deploy-staging:
    if: github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.head_branch, '-rc')
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install git+https://github.com/Itential/asyncplatform.git

      - name: Find changed files
        id: find-files
        run: |
          CURRENT_TAG=$(git tag --points-at HEAD | head -1 || true)
          PREV_TAG=$(git tag --sort=-creatordate \
            | grep -v "^${CURRENT_TAG}$" | head -1 || true)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag — processing all assets"
            echo "changed_files=" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Diffing against $PREV_TAG"
            # Get all added/modified files between the previous tag and HEAD, output as a JSON array
            CHANGED=$(git diff --name-only --diff-filter=AM "$PREV_TAG" HEAD \
              | jq -R . | jq -sc .)
            echo "changed_files=$CHANGED" >> "$GITHUB_OUTPUT"

            # Check if any changed files are actual asset files
            if echo "$CHANGED" | jq -r '.[]' \
              | grep -qE "(Projects|Automations|LCM Resource Models|Golden Configurations)/.*\.json$"; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "No asset changes detected — skipping"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Deploy assets to Staging
        if: steps.find-files.outputs.has_changes == 'true'
        env:
          HOST: ${{ secrets.PLATFORM_HOST }}
          CLIENT_ID: ${{ secrets.PLATFORM_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PLATFORM_CLIENT_SECRET }}
          PROJECT_MEMBERS: ${{ vars.PROJECT_MEMBERS }}
          CHANGED_FILES: ${{ steps.find-files.outputs.changed_files }}
        run: |
          python .github/scripts/deploy.py Staging


  deploy-production:
    if: github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_branch, '-rc')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install git+https://github.com/Itential/asyncplatform.git

      - name: Find changed files
        id: find-files
        run: |
          CURRENT_TAG=$(git tag --points-at HEAD | head -1 || true)
          PREV_TAG=$(git tag --sort=-creatordate \
            | grep -v "^${CURRENT_TAG}$" | grep -v "\-rc" | head -1 || true)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag — processing all assets"
            echo "changed_files=" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Diffing against $PREV_TAG"
            # Get all added/modified files between the previous tag and HEAD, output as a JSON array
            CHANGED=$(git diff --name-only --diff-filter=AM "$PREV_TAG" HEAD \
              | jq -R . | jq -sc .)
            echo "changed_files=$CHANGED" >> "$GITHUB_OUTPUT"

            # Check if any changed files are actual asset files
            if echo "$CHANGED" | jq -r '.[]' \
              | grep -qE "(Projects|Automations|LCM Resource Models|Golden Configurations)/.*\.json$"; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "No asset changes detected — skipping"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Deploy assets to Production
        if: steps.find-files.outputs.has_changes == 'true'
        env:
          HOST: ${{ secrets.PLATFORM_HOST }}
          CLIENT_ID: ${{ secrets.PLATFORM_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PLATFORM_CLIENT_SECRET }}
          PROJECT_MEMBERS: ${{ vars.PROJECT_MEMBERS }}
          CHANGED_FILES: ${{ steps.find-files.outputs.changed_files }}
        run: |
          python .github/scripts/deploy.py Production
